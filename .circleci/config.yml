version: 2.1

orbs:
  tools: replikativ/clj-tools@0

jobs:
  prepare:
    executor: tools/clojurecli
    steps:
      - checkout
      - restore_cache:
          keys:
            - spindel-ci-deps-v1-{{ checksum "deps.edn" }}-{{ checksum ".circleci/config.yml" }}
            - spindel-ci-deps-v1-
            - deps-{{ checksum "deps.edn" }}
            - deps-
      - run:
          name: Prepare each job's dependency graph
          command: |
            clojure -P -M
            clojure -P -M:test
            clojure -P -M:format
            clojure -P -T:build
            clojure -P -M:cljs
      - save_cache:
          key: spindel-ci-deps-v1-{{ checksum "deps.edn" }}-{{ checksum ".circleci/config.yml" }}
          paths:
            - /home/circleci/.m2
            - /home/circleci/.gitlibs
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
            - npm-
      - run: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - /home/circleci/.npm
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - .gitlibs
            - .npm
            - replikativ

  v2-lifetime:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci/
      - run:
          name: Run v2 JVM acceptance independently of legacy engine tests
          command: >-
            clojure -J-Xmx1g -X:test
            :patterns '["org.replikativ.spindel.v2.*"]'
            :excludes '[:gap]'
      - run:
          name: Compile v2 Node lifetime acceptance probe
          command: >-
            clojure -J-Xmx1g -Sdeps '{:paths ["src" "test-cljs"]}'
            -M -m cljs.main
            -co '{:target :nodejs :optimizations :simple :output-dir "target/lifetime-gc/out" :output-to "target/lifetime-gc/main.js"}'
            -c org.replikativ.spindel.v2.lifetime-gc
      - run:
          name: Verify v2 ownership with real Node garbage collection
          command: node --expose-gc target/lifetime-gc/main.js


  v2-cleanup:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci/
      - run:
          name: Compile v2 cleanup smoke tests
          command: >-
            clojure -J-Xmx1g -Sdeps '{:paths ["src" "test-cljs"]}' -M -m cljs.main
            -co '{:target :nodejs :optimizations :simple :elide-asserts false :output-dir "target/cleanup-smoke/out" :output-to "target/cleanup-smoke/main.js"}'
            -c org.replikativ.spindel.v2.smoke
      - run:
          name: Run v2 cleanup smoke tests
          command: node target/cleanup-smoke/main.js
      - run:
          name: Compile v2 World-close smoke tests
          command: |
            rm -rf target/world-close-smoke
            clojure -J-Xmx1g -Sdeps '{:paths ["src" "test-cljs"]}' -M -m cljs.main -co '{:target :nodejs :optimizations :simple :elide-asserts false :output-dir "target/world-close-smoke/out" :output-to "target/world-close-smoke/main.js"}' -c org.replikativ.spindel.v2.world-close-smoke
      - run:
          name: Run v2 World-close smoke tests
          command: node target/world-close-smoke/main.js
      - run:
          name: Compile v2 cleanup retention probes
          command: >-
            clojure -J-Xmx1g -Sdeps '{:paths ["src" "test-cljs"]}' -M -m cljs.main
            -co '{:target :nodejs :optimizations :simple :elide-asserts false :output-dir "target/cleanup-gc/out" :output-to "target/cleanup-gc/main.js"}'
            -c org.replikativ.spindel.v2.cleanup-gc
      - run:
          name: Verify cleanup retention with real Node garbage collection
          command: node --expose-gc target/cleanup-gc/main.js
      - run:
          name: Compile unoptimized v2 cleanup retention probes
          command: |
            rm -rf target/cleanup-gc-none
            clojure -J-Xmx1g -Sdeps '{:paths ["src" "test-cljs"]}' -M -m cljs.main -co '{:target :nodejs :optimizations :none :elide-asserts false :output-dir "target/cleanup-gc-none/out" :output-to "target/cleanup-gc-none/main.js"}' -c org.replikativ.spindel.v2.cleanup-gc
      - run:
          name: Verify unoptimized cleanup retention with real Node garbage collection
          command: node --expose-gc target/cleanup-gc-none/main.js

workflows:
  build-test-and-deploy:
    jobs:
      - prepare:
          name: tools/setup
          context: docker-deploy
      - tools/build:
          context: docker-deploy
          build_cljs: true
          requires:
            - tools/setup
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/unittest:
          context: docker-deploy
          requires:
            - tools/build
      - tools/cljstest:
          context: docker-deploy
          requires:
            - tools/build
      - v2-lifetime:
          context: docker-deploy
          requires:
            - tools/build
      - v2-cleanup:
          context: docker-deploy
          requires:
            - tools/build
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/format
            - tools/unittest
            - tools/cljstest
            - v2-lifetime
            - v2-cleanup
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
